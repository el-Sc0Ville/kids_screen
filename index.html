<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Popcorn">
<meta name="theme-color" content="#1E1B4B">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Popcorn</title>
<style>
:root{
  --bg:#1E1B4B; --card:#2A2766; --card2:#3A3591; --deep:#16133A; --ink:#FFF8F0; --ink2:#C9C5F2; --line:rgba(255,255,255,.12);
  --gold:#FFD166; --gold-ink:#3B2600; --green:#06D6A0; --red:#EF476F;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box; touch-action:manipulation;}
html,body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);}
body{
  background:
    radial-gradient(1100px 700px at 15% -10%, #4338CA 0%, transparent 60%),
    radial-gradient(900px 700px at 110% 110%, rgba(124,58,237,.35) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
#app{min-height:100vh; display:flex; flex-direction:column;}
.screen{flex:1; width:100%; max-width:1100px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:18px;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));}
:where(button, a.btn, a.plat){font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-decoration:none;}
button:disabled{opacity:.45; pointer-events:none;}
.topbar{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px;}
.iconbtn{width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.08); font-size:26px; display:grid; place-items:center; flex:none;}
.iconbtn.ghost{visibility:hidden;}
.iconbtn.sm{width:40px; height:40px; font-size:18px;}
.me{display:flex; align-items:center; gap:12px; font-size:26px; font-weight:800;}
.ava{width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,.1); display:grid; place-items:center; font-size:46px; flex:none;}
.ava.sm{width:56px; height:56px; font-size:36px;}
.hero{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center;}
.hello{margin:0; font-size:clamp(34px, 6vw, 56px); font-weight:900; letter-spacing:.3px;}
.title{margin:4px 0 0; font-size:clamp(30px, 5vw, 46px); font-weight:900; text-align:center;}
.sub{margin:0; font-size:22px; color:var(--ink2);}
.hint{margin:0; font-size:18px; color:var(--ink2);}
.logo{font-size:84px; line-height:1;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:0 28px; border-radius:999px;
  font-size:24px; font-weight:800; background:var(--card2); color:var(--ink); box-shadow:0 6px 0 rgba(0,0,0,.28); transition:transform .08s;}
.btn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.28);}
.btn.go{background:var(--gold); color:var(--gold-ink);}
.btn.big{min-height:88px; font-size:34px; padding:0 44px;}
.btn.small{min-height:44px; font-size:17px; padding:0 18px; box-shadow:0 4px 0 rgba(0,0,0,.25);}
.btn.danger{background:#5b1f33; color:#ffd6df;}

/* who */
.kids{display:flex; flex-wrap:wrap; gap:24px; justify-content:center;}
.kid{width:220px; padding:28px 16px; border-radius:32px; background:var(--card); display:flex; flex-direction:column; align-items:center; gap:14px;
  font-size:30px; font-weight:800; box-shadow:0 8px 0 rgba(0,0,0,.28);}
.kid .ava{width:140px; height:140px; font-size:92px;}

/* home */
.mech{display:flex; flex-direction:column; align-items:center; gap:10px; padding:30px 46px 26px; border-radius:40px; background:var(--gold); color:var(--gold-ink);
  box-shadow:0 10px 0 rgba(0,0,0,.28); animation:breathe 2.8s ease-in-out infinite;}
.mech:active{transform:translateY(4px) scale(.99);}
.mech-ico{font-size:120px; line-height:1;}
.mech-lbl{font-size:clamp(28px, 5vw, 40px); font-weight:900;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.tvbar{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; font-size:28px;}
.tvbar span.used{opacity:.22; filter:grayscale(1);}
.status{background:var(--card); border-radius:36px; padding:28px 26px; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:560px;
  box-shadow:0 10px 0 rgba(0,0,0,.25);}
.s-emoji{font-size:100px; line-height:1;}
.s-title{font-size:32px; font-weight:900;}
.s-sub{font-size:22px; color:var(--ink2);}
.idea{font-size:26px; font-weight:800; background:rgba(255,255,255,.07); border-radius:20px; padding:14px 18px;}
.bonus{background:rgba(6,214,160,.14); color:#8FF7DA; padding:10px 18px; border-radius:999px; font-weight:800; font-size:19px;}

/* wheel */
.wheel-wrap{position:relative; width:min(84vw, 60vh, 560px); aspect-ratio:1; margin:8px auto 0;}
#wheel{width:100%; height:100%; transform-origin:50% 50%; filter:drop-shadow(0 14px 26px rgba(0,0,0,.4)); display:block;}
#wheel text{pointer-events:none;}
.slice.win path, .slice.win circle{filter:brightness(1.25);}
.pointer{position:absolute; left:50%; top:-16px; transform:translateX(-50%); width:0; height:0; z-index:2;
  border-left:24px solid transparent; border-right:24px solid transparent; border-top:44px solid var(--gold); filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));}
.hub{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:26%; aspect-ratio:1; border-radius:50%; z-index:3;
  background:var(--gold); color:var(--gold-ink); font-size:clamp(18px, 3.4vw, 32px); font-weight:900;
  box-shadow:0 6px 0 rgba(0,0,0,.3), inset 0 -6px 0 rgba(0,0,0,.12);}
.hub:disabled{opacity:1;}

/* gumball */
.gumball{position:relative; width:min(66vw, 50vh, 400px); aspect-ratio:300/430;}
.gumball svg{width:100%; height:100%; display:block;}
#crank{transform-box:fill-box; transform-origin:center;}
.turn #crank{animation:crank 1.1s ease-in-out;}
@keyframes crank{to{transform:rotate(360deg);}}
.turn #balls{animation:shake .12s linear 9;}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px)}100%{transform:translate(0,0)}}
.prize{position:absolute; width:12%; aspect-ratio:1; border-radius:50%; left:44%; top:84.5%; opacity:0;
  box-shadow:inset -5px -6px 0 rgba(0,0,0,.18), inset 5px 5px 0 rgba(255,255,255,.4);}
.prize.drop{animation:drop .9s cubic-bezier(.3,1.5,.5,1) forwards;}
@keyframes drop{0%{opacity:0; transform:translateY(-40%) scale(.5)}35%{opacity:1}100%{opacity:1; transform:translateY(55%) scale(1.15)}}

/* cards */
.cards3{display:flex; gap:clamp(12px, 3vw, 30px); justify-content:center; perspective:1200px; margin-top:3vh; flex-wrap:wrap;}
.pcard{width:min(27vw, 230px); aspect-ratio:3/4; position:relative; padding:0;}
.pcard .inner{position:absolute; inset:0; transition:transform .7s cubic-bezier(.3,1.3,.5,1); transform-style:preserve-3d;
  animation:wobble 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * .35s);}
.pcard.flipped .inner{animation:none; transform:rotateY(180deg);}
@keyframes wobble{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.pcard .face{position:absolute; inset:0; border-radius:26px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; box-shadow:0 10px 0 rgba(0,0,0,.28);}
.pcard .back{background:repeating-linear-gradient(45deg, #7C3AED 0 16px, #6D28D9 16px 32px); font-size:clamp(60px, 10vw, 96px); font-weight:900; color:var(--gold);
  border:6px solid rgba(255,255,255,.18);}
.pcard .front{transform:rotateY(180deg); background:var(--c, #fff); color:var(--bg);}
.pcard .fe{font-size:clamp(54px, 9vw, 84px); line-height:1;}
.pcard .fn{font-size:clamp(16px, 2.4vw, 22px); font-weight:900; text-align:center; padding:0 8px;}
.pcard.dim{opacity:.5; transform:scale(.93); transition:opacity .4s, transform .4s;}

/* overlays */
#layer{position:relative; z-index:40;}
.overlay{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px;
  background:rgba(15,12,40,.74); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reveal-card{background:var(--c); color:var(--bg); border-radius:44px; padding:34px 54px; text-align:center; box-shadow:0 14px 0 rgba(0,0,0,.28);
  animation:popin .6s cubic-bezier(.3,1.6,.5,1);}
.r-emoji{font-size:140px; line-height:1;}
.r-label{font-size:24px; font-weight:800; opacity:.7; margin-top:6px;}
.r-name{font-size:clamp(36px, 6vw, 54px); font-weight:900;}
@keyframes popin{from{transform:scale(.3) rotate(-8deg); opacity:0}to{transform:scale(1) rotate(0); opacity:1}}
.confetti{position:fixed; top:-24px; width:12px; height:18px; border-radius:3px; z-index:60; pointer-events:none; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}
.dialog, .snackbox{background:var(--card); border-radius:32px; padding:26px; max-width:520px; width:100%; text-align:center; display:flex; flex-direction:column; gap:16px; align-items:center;}
.dialog h2, .snackbox h2{margin:0; font-size:28px;}
.dialog p{margin:0; font-size:18px; color:var(--ink2);}
.toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#0f0c2e; color:var(--ink);
  padding:14px 22px; border-radius:999px; font-size:18px; font-weight:700; z-index:70; box-shadow:0 8px 24px rgba(0,0,0,.4); transition:opacity .4s;}
.toast.out{opacity:0;}

/* pick */
.pickhead{display:flex; align-items:center; gap:14px; font-size:clamp(26px, 4.4vw, 38px); font-weight:900;}
.pickhead .chip-emoji{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:38px; background:var(--c);}
.shows{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:18px; width:100%; max-width:980px;}
.show{background:var(--card); border-radius:30px; padding:22px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.28); border:5px solid transparent; transition:transform .15s, border-color .15s;}
.show.on{border-color:var(--gold); transform:scale(1.03);}
.show .s-em{font-size:80px; width:128px; height:128px; border-radius:50%; background:var(--c); display:grid; place-items:center; line-height:1;}
.show .s-t{font-size:23px; font-weight:900; line-height:1.15;}
.s-meta{font-size:16px; color:var(--ink2); display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;}
.show .s-em.has-art{width:100%; height:auto; aspect-ratio:16/9; border-radius:20px; background-size:cover; background-position:center; position:relative; font-size:0;}
.show .s-em.has-art i{position:absolute; right:8px; bottom:8px; width:48px; height:48px; border-radius:50%; background:rgba(15,12,40,.6); display:grid; place-items:center; font-size:28px; font-style:normal;}
.s-art{width:100%; max-width:440px; aspect-ratio:16/9; border-radius:22px; background-size:cover; background-position:center; box-shadow:0 8px 0 rgba(0,0,0,.25);}
.showrow .se img{width:44px; height:44px; object-fit:cover; border-radius:10px; display:block;}
.tabs{display:flex; gap:8px; overflow-x:auto; width:100%; max-width:860px; padding:2px 2px 8px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.tab{flex:none; padding:10px 18px; border-radius:999px; background:var(--card); color:var(--ink2); font-weight:800; font-size:16px;}
.tab.on{background:var(--gold); color:var(--gold-ink);}
.pill{display:inline-block; padding:4px 12px; border-radius:999px; font-size:15px; font-weight:800; color:#fff; white-space:nowrap;}
.dose{position:sticky; bottom:calc(10px + env(safe-area-inset-bottom)); width:100%; max-width:760px; background:var(--card2); border-radius:34px; padding:22px;
  display:flex; flex-direction:column; align-items:center; gap:10px; box-shadow:0 -6px 30px rgba(0,0,0,.35); animation:up .3s ease; z-index:5;}
@keyframes up{from{transform:translateY(30px); opacity:0}to{transform:none; opacity:1}}
.dose-big{font-size:clamp(28px, 5vw, 38px); font-weight:900;}
.dose-eps{font-size:30px; letter-spacing:2px;}
.dose-sub{font-size:18px; color:var(--ink2);}
.dose-actions{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}

/* dealer */
.plats{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:820px;}
.plat{min-width:200px; padding:24px 22px; border-radius:26px; background:var(--c); color:#fff; font-size:26px; font-weight:900; box-shadow:0 8px 0 rgba(0,0,0,.3);}

/* snack */
.slot{display:flex; gap:16px; background:var(--deep); padding:16px; border-radius:28px; border:6px solid var(--gold);}
.reel{width:120px; height:120px; overflow:hidden; border-radius:18px; background:#fff;}
.strip div{height:120px; display:grid; place-items:center; font-size:78px; line-height:1;}
.slot-res{font-size:30px; font-weight:900; min-height:40px;}

/* youtube player */
.player{width:min(96vw, 1100px); background:#000; border-radius:22px; overflow:hidden;}
.player-top{display:flex; align-items:center; justify-content:space-between; padding:10px 12px 10px 18px; font-size:20px; font-weight:800; background:#111;}
.frame{position:relative; aspect-ratio:16/9;}
.frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

/* pin */
.pin{display:flex; flex-direction:column; align-items:center; gap:20px; margin-top:3vh; text-align:center;}
.pin h2{margin:0; font-size:26px; max-width:520px;}
.dots{display:flex; gap:14px;}
.dots span{width:20px; height:20px; border-radius:50%; border:3px solid var(--ink2);}
.dots span.f{background:var(--ink); border-color:var(--ink);}
.pad{display:grid; grid-template-columns:repeat(3, 84px); gap:14px;}
.pad button{height:84px; border-radius:50%; background:var(--card2); font-size:32px; font-weight:800;}
.shake{animation:shakex .4s;}
@keyframes shakex{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

/* settings */
.settings{max-width:860px; width:100%; display:flex; flex-direction:column; gap:16px; -webkit-user-select:text; user-select:text;}
.sec{background:var(--card); border-radius:22px; padding:16px 18px 10px;}
.sec h2{margin:0 0 6px; font-size:22px;}
.sec h3{margin:14px 0 4px; font-size:18px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:17px;}
.sec h2 + .row, .sec h2 + p + .row{border-top:0;}
.row.col{flex-direction:column; align-items:flex-start;}
.row select{max-width:62%;}
.row.wrap{flex-wrap:wrap;}
.row.wrap input{flex:1 1 180px; min-width:160px;}
.small{font-size:14px; color:var(--ink2);}
p.small{margin:6px 0 8px;}
select, input[type=text], input[type=url], input[type=number], input[type=search]{font:inherit; font-size:17px; padding:10px 12px; border-radius:12px;
  border:1px solid rgba(255,255,255,.18); background:var(--deep); color:var(--ink); min-width:0; max-width:100%;}
input.tog{appearance:none; -webkit-appearance:none; width:54px; height:32px; border-radius:999px; background:#4b4785; position:relative; transition:background .2s; flex:none; margin:0; cursor:pointer;}
input.tog::after{content:''; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:transform .2s;}
input.tog:checked{background:var(--green);}
input.tog:checked::after{transform:translateX(22px);}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:8px 12px; border-radius:999px; background:var(--deep); border:2px solid var(--line); font-size:16px; cursor:pointer;}
.chip.on{border-color:var(--gold); background:#3a2f12;}
.showlist{max-height:70vh; overflow:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line);}
.showrow{display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.showrow .se{font-size:32px; text-align:center;}
.showrow .st{font-weight:800; font-size:17px;}
.showrow .why{color:#E8E5FF; opacity:.85;}
.showrow em{color:#FFD6A5; font-style:normal;}
.ok{color:#8FF7DA; margin-right:8px;}
.plats-inline .on{color:var(--ink); font-weight:700;}
.plats-inline .off{opacity:.5;}
.sr-actions{display:flex; align-items:center; gap:8px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 0 4px;}
.grid2 label{display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--ink2);}
.grid2 .span2{grid-column:1 / -1;}
.row-btns{display:flex; justify-content:center;}
.settings-top strong{font-size:20px;}
a.link{color:var(--gold);}

@media (max-width:560px){
  .grid2{grid-template-columns:1fr;}
  .row:has(> select){flex-wrap:wrap;}
  .row:has(> select) > label{flex:1 1 100%;}
  .row:has(> select) > select{flex:1 1 100%; max-width:100%;}
  .kid{width:160px;} .kid .ava{width:110px; height:110px; font-size:70px;}
  .pcard{width:28vw;}
}
@media (prefers-reduced-motion: reduce){
  .mech, .pcard .inner{animation:none;}
  .confetti{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/*CORE-START*/
/* =====================================================================
   POPCORN: a show picker for kids.
   Everything the app knows lives in this first block: streaming
   services, themes and the show list. To add or fix a show, edit SHOWS.
   Show fields:
     id     unique id            t   title         tf  French title (optional)
     e      emoji on the card    th  themes        a   [youngest, oldest] age
     p      pace 1 calm, 2 medium, 3 busy          m   minutes per episode (about)
     l      links by service (opens the show in that service's app)
     lang   'fr' for French-language entries       ytId YouTube channel id (in-app player)
     why    note for parents      note  caution for parents
     q      search words for the show picture (optional)
   Links were checked against JustWatch Canada and the services in Nov 2026.
   Availability changes, so recheck now and then.
   ===================================================================== */
const VERSION = '1.0';

const PLATFORMS = {
  netflix:    { name: 'Netflix',     color: '#E50914', home: 'https://www.netflix.com/',         search: 'https://www.netflix.com/search?q={q}',               def: true,  note: '' },
  disney:     { name: 'Disney+',     color: '#1F3FBF', home: 'https://www.disneyplus.com/en-ca', search: '',                                                    def: true,  note: '' },
  prime:      { name: 'Prime Video', color: '#1A98FF', home: 'https://app.primevideo.com/',      search: 'https://app.primevideo.com/search/?phrase={q}',      def: true,  note: '' },
  crave:      { name: 'Crave',       color: '#2563EB', home: 'https://www.crave.ca/en',          search: '',                                                    def: true,  note: '' },
  telequebec: { name: 'Télé-Québec', color: '#0EA5E9', home: 'https://www.telequebec.tv/',       search: '',                                                    def: true,  note: 'Free, French' },
  youtube:    { name: 'YouTube',     color: '#FF0033', home: 'https://www.youtube.com/',         search: 'https://www.youtube.com/results?search_query={q}',   def: true,  note: '' },
  appletv:    { name: 'Apple TV',    color: '#6B7280', home: 'https://tv.apple.com/ca',          search: 'https://tv.apple.com/ca/search?term={q}',            def: false, note: 'Subscription, formerly Apple TV+' },
  tfo:        { name: 'TFO',         color: '#DB2777', home: 'https://www.tfo.org/minitfo',      search: 'https://www.tfo.org/explorer?q={q}',                 def: false, note: 'Free, French, plays in Safari' },
  tubi:       { name: 'Tubi',        color: '#7C3AED', home: 'https://tubitv.com/',              search: '',                                                    def: false, note: 'Free with ads' },
};
const PLATFORM_ORDER = Object.keys(PLATFORMS);

const THEMES = {
  feelings: { emoji: '💛', en: 'Feelings',          fr: 'Émotions',            color: '#FFB703' },
  curious:  { emoji: '🔬', en: 'Curious minds',     fr: 'Curiosité',           color: '#4CC9F0' },
  nature:   { emoji: '🌿', en: 'Nature & animals',  fr: 'Nature et animaux',   color: '#52B788' },
  numbers:  { emoji: '🔢', en: 'Numbers & letters', fr: 'Chiffres et lettres', color: '#F786C1' },

/* wheel */
function wheelSlices(opts) {
  const total = opts.reduce((a, o) => a + o.w, 0); let acc = 0;
  return opts.map(o => { const span = o.w / total * 360; const sl = { key: o.key, start: acc, end: acc + span }; acc += span; return sl; });
}
function pt(r, deg) { const a = deg * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; }
function wheelHTML(opts) {
  const sl = wheelSlices(opts); ui.slices = sl; const R = 150;
  const slices = sl.map(s => {
    const th = THEMES[s.key]; let shape;
    if (sl.length === 1) shape = `<circle r="${R}" fill="${th.color}"/>`;
    else {
      const [x1, y1] = pt(R, s.start), [x2, y2] = pt(R, s.end), large = (s.end - s.start) > 180 ? 1 : 0;
      shape = `<path d="M0 0 L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${th.color}" stroke="#1E1B4B" stroke-width="3"/>`;
    }
    const mid = (s.start + s.end) / 2, [tx, ty] = pt(R * 0.64, mid), fs = (s.end - s.start) < 30 ? 26 : 40;
    return `<g class="slice" data-key="${s.key}">${shape}<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${th.emoji}</text></g>`;
  }).join('');
  const studs = sl.length > 1 ? sl.map(s => { const [x, y] = pt(155, s.start); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#FFF8F0"/>`; }).join('') : '';
  return `<div class="wheel-wrap"><div class="pointer"></div>
    <svg id="wheel" viewBox="-160 -160 320 320" style="transform:rotate(${ui.wheelRot}deg)" data-act="wheelspin" role="img" aria-label="Spinning wheel">
      <circle r="159" fill="#FFD166"/><circle r="152" fill="#1E1B4B"/>${slices}${studs}</svg>
    <button class="hub" data-act="wheelspin">${L().spin}</button></div>`;
}
function spinWheelTo(key, done) {
  const svg = $('#wheel'); const sl = ui.slices; const s = sl.find(x => x.key === key) || sl[0];
  const span = s.end - s.start, center = s.start + span / 2 + (Math.random() - 0.5) * span * 0.6;
  const start = ui.wheelRot; let target = start - (start % 360) + 360 * 6 + (360 - center);
  while (target < start + 360 * 5) target += 360;
  const dur = 5200, t0 = performance.now();
  const sliceAt = rot => { const a = ((360 - (rot % 360)) % 360 + 360) % 360; return sl.findIndex(x => a >= x.start && a < x.end); };
  let last = sliceAt(start);
  function frame(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4), rot = start + (target - start) * e;
    svg.style.transform = `rotate(${rot}deg)`;
    const cur = sliceAt(rot); if (cur !== last) { sfx.tick(); last = cur; }
    if (k < 1) requestAnimationFrame(frame); else { ui.wheelRot = target % 360; done(); }
  }
  requestAnimationFrame(frame);
}

/* ---------- show pictures (TMDB, needs a free key from themoviedb.org) ---------- */
const K_ART = 'popcorn.art';
let ART = store.get(K_ART, {}) || {};
const artQueue = new Set(); let artBusy = false;
function artFor(sh) {
  if (!S.tmdbKey || !sh || ui.artErr) return '';
  const ks = Object.keys(sh.l || {});
  if (ks.length === 1 && ks[0] === 'youtube') return '';          // YouTube channels aren't on TMDB
  if (sh.id in ART) return ART[sh.id];
  artQueue.add(sh.id); setTimeout(pumpArt, 0); return '';
}
function artBox(sh) {
  const a = artFor(sh);
  return a ? `<span class="s-em has-art" style="background-image:url('${esc(a)}')"><i>${sh.e}</i></span>` : `<span class="s-em">${sh.e}</span>`;
}
function heroArt(sh) {
  const a = sh ? artFor(sh) : '';
  return a ? `<div class="s-art" style="background-image:url('${esc(a)}')"></div>` : `<div class="s-emoji">${sh ? sh.e : '🎲'}</div>`;
}
async function lookupArt(sh) {
  const key = S.tmdbKey.trim(), bearer = key.startsWith('eyJ');
  const query = sh.q || sh.t.replace(/\s*\(.*?\)\s*/g, '').trim();
  const url = `https://api.themoviedb.org/3/search/${sh.kind === 'movie' ? 'movie' : 'tv'}?query=${encodeURIComponent(query)}&language=${sh.lang === 'fr' && !sh.q ? 'fr-CA' : 'en-CA'}&include_adult=false`
    + (bearer ? '' : `&api_key=${encodeURIComponent(key)}`);
  const r = await fetch(url, bearer ? { headers: { Authorization: 'Bearer ' + key, accept: 'application/json' } } : {});
  if (!r.ok) { const e = new Error('tmdb ' + r.status); e.status = r.status; throw e; }
  const res = ((await r.json()).results || []);
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
  const best = res.find(x => [x.name, x.title, x.original_name, x.original_title].some(n => norm(n) === norm(query))) || res[0];
  const path = best && (best.backdrop_path || best.poster_path);
  return path ? 'https://image.tmdb.org/t/p/w780' + path : '';
}
async function pumpArt() {
  if (artBusy || typeof fetch !== 'function') return; artBusy = true; let changed = false;
  while (artQueue.size) {
    const id = artQueue.values().next().value; artQueue.delete(id);
    const sh = showById(id, S); if (!sh || id in ART) continue;
    try { ART[id] = await lookupArt(sh); changed = true; }
    catch (e) {
      if (e.status === 401 || e.status === 403) { ui.artErr = true; artQueue.clear(); toast("That TMDB key didn't work"); break; }
      if (e.status === 429) { artQueue.add(id); await new Promise(r => setTimeout(r, 1500)); continue; }
      ART[id] = ''; changed = true;
    }
    store.set(K_ART, ART);
  }
  artBusy = false;
  if (!changed || $('#layer').children.length) return;
  if (['pick', 'home'].includes(ui.screen)) render();
  else if (ui.screen === 'settings') refreshShowList();
}

function showListHTML() {
  const q = (ui.showQ || '').toLowerCase().trim();
  const list = allShows(S).filter(sh => !q || (sh.t + ' ' + (sh.tf || '')).toLowerCase().includes(q)).sort((a, b) => a.t.localeCompare(b.t));
  return list.map(showRow).join('') || '<p class="small">No shows match that search.</p>';
}
function refreshShowList() { const el = $('#showlist'); if (el) el.innerHTML = showListHTML(); }
const SET_TABS = [['today', 'Today'], ['kids', 'Kids'], ['services', 'Services'], ['shows', 'Shows'], ['extras', 'Snacks & sound'], ['share', 'Share & PIN']];
function viewSettings() {
  const tab = ui.setTab || 'today';
  const tabs = `<div class="tabs" role="tablist">${SET_TABS.map(([k, t]) => `<button class="tab ${tab === k ? 'on' : ''}" role="tab" data-act="setTab" data-t="${k}">${t}</button>`).join('')}</div>`;
  const body = ({ today: setToday, kids: setKids, services: setServices, shows: setShows, extras: setExtras, share: setShare }[tab] || setToday)();
  return `<div class="screen">
  <div class="topbar settings-top"><button class="btn small go" data-act="exitSettings">Done</button><strong>Grown-up settings</strong><span class="small">v${VERSION}</span></div>
  ${tabs}<div class="settings">${body}</div></div>`;
}
function setToday() {
  const dev = store.get(K_DEV, null);
  return `<section class="sec"><h2>Today</h2>
    ${S.kids.map(k => `<div class="row"><span>${k.emoji} <strong>${esc(k.name)}</strong><br><span class="small">${todaySummary(k)}</span></span><button class="btn small" data-act="resetToday" data-id="${k.id}">Reset today</button></div>`).join('')}
    <div class="row"><span class="small">A fresh start: new spin, full time, snack spin back.</span><button class="btn small" data-act="resetAll">Reset everyone</button></div>
  </section>
  <section class="sec"><h2>This iPad</h2>
    <div class="row"><label for="dev">Who uses this iPad?</label><select id="dev" data-device="1"><option value="">Ask each time</option>${S.kids.map(k => `<option value="${k.id}" ${dev === k.id ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select></div>
    <p class="small">Pick a kid so this iPad always opens their spinner, and nobody borrows a sibling's spin. Set this on each iPad.</p>
  </section>`;
}
function setKids() {
  return `${S.kids.map(kidSettings).join('')}
    <div class="row-btns"><button class="btn small" data-act="addKid" ${S.kids.length >= 4 ? 'disabled' : ''}>+ Add a kid</button></div>`;
}
function setServices() {
  const platRows = PLATFORM_ORDER.map(k => {
    const pl = PLATFORMS[k], n = SHOWS.filter(s => s.l[k]).length;
    return `<div class="row"><label><span class="pill" style="background:${pl.color}">${esc(pl.name)}</span> <span class="small">${n} shows${pl.note ? ' · ' + esc(pl.note) : ''}</span></label>
      <input type="checkbox" class="tog" data-set="platforms.${k}" ${S.platforms[k] ? 'checked' : ''} aria-label="${esc(pl.name)}"></div>`;
  }).join('');
  return `<section class="sec"><h2>Streaming services</h2><p class="small">Only shows on the services you turn on can land.</p>${platRows}</section>
    <section class="sec"><h2>Opening shows</h2>
      <div class="row"><label>Open shows in</label><select data-set="linkMode">${opts([['blank', 'A new tab (works best)'], ['self', 'The same tab']], S.linkMode)}</select></div>
      <div class="row"><label>YouTube picks</label><select data-set="youtube">${opts([['app', 'Open the YouTube app'], ['inside', 'Play inside Popcorn (test first)']], S.youtube)}</select></div>
      <p class="small">Télé-Québec and TFO play in Safari; the others open their apps. Re-run the <a class="link" href="linktest.html">link test</a> anytime.</p>
    </section>`;
}
function setShows() {
  const age = [2, 3, 4, 5, 6, 7, 8, 9, 10].map(a => [a, a]);
  const loaded = Object.values(ART).filter(Boolean).length;
  const artState = !S.tmdbKey ? 'Off' : ui.artErr ? "The key didn't work" : `${loaded} pictures loaded`;
  return `<section class="sec"><h2>Show pictures</h2>
      <p class="small">Paste a free TMDB API key to show each show's real artwork on the cards. Get one at <a class="link" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a> (free account, personal use). YouTube channels keep their emoji.</p>
      <div class="row wrap"><input type="text" placeholder="TMDB API key or read access token" value="${esc(S.tmdbKey)}" data-set="tmdbKey" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn small" data-act="refreshArt" ${S.tmdbKey ? '' : 'disabled'}>Reload pictures</button></div>
      <p class="small">Status: ${artState}. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </section>
    <section class="sec"><h2>Shows</h2>
      <p class="small">Turn off anything you don't want to land. The notes are a starting point, not a professional review.</p>
      <div class="row"><input type="search" placeholder="Search shows" value="${esc(ui.showQ)}" data-input="showQ" style="flex:1"></div>
      <div class="showlist" id="showlist">${showListHTML()}</div>
    </section>
    <section class="sec"><h2>Heard about a new show?</h2>
      <div class="row wrap"><input type="search" id="jwq" placeholder="Show name"><button class="btn small" data-act="jw">Where can we watch it?</button></div>
      <p class="small">Opens JustWatch for Canada so you can see which app has it. Then add it here, with the link if you have it.</p>
      <div class="grid2">
        <label class="span2">Title<input type="text" id="af-t" maxlength="60"></label>
        <label>Emoji<input type="text" id="af-e" value="📺" maxlength="4"></label>
        <label>Theme<select id="af-th">${opts(THEME_KEYS.map(t => [t, THEMES[t].emoji + ' ' + THEMES[t].en]), 'feelings')}</select></label>
        <label>Where<select id="af-p">${opts(PLATFORM_ORDER.map(k => [k, PLATFORMS[k].name]), 'netflix')}</select></label>
        <label>Minutes per episode<input type="number" id="af-m" value="15" min="3" max="120"></label>
        <label class="span2">Link to the show (optional)<input type="url" id="af-l" placeholder="https://"></label>
        <label>Youngest age<select id="af-a0">${opts(age, 3)}</select></label>
        <label>Oldest age<select id="af-a1">${opts(age, 8)}</select></label>
        <label>Pace<select id="af-pace">${opts([[1, 'Calm'], [2, 'Medium'], [3, 'Busy']], 2)}</select></label>
        <label>Language<select id="af-lang">${opts([['en', 'English'], ['fr', 'French']], 'en')}</select></label>
      </div>
      <div class="row"><span class="small">Without a link, the button opens the app's search, or its home screen.</span><button class="btn small go" data-act="addShow">Add show</button></div>
    </section>`;
}
function setExtras() {
  const chipSet = (map, path, state) => Object.keys(map).map(k => `<label class="chip ${state[k] ? 'on' : ''}"><input type="checkbox" hidden data-set="${path}.${k}" ${state[k] ? 'checked' : ''}>${map[k].e} ${map[k].en}</label>`).join('');
  return `<section class="sec"><h2>Snack spin</h2>
      <div class="row"><label>Snack spin after picking a show</label><input type="checkbox" class="tog" data-set="snack.on" ${S.snack.on ? 'checked' : ''}></div>
      <div class="row"><label>Add a drink reel</label><input type="checkbox" class="tog" data-set="snack.drink" ${S.snack.drink ? 'checked' : ''}></div>
      <div class="row col"><label>Snacks</label><div class="chips">${chipSet(SNACKS, 'snack.snacks', S.snack.snacks)}</div></div>
      <div class="row col"><label>Drinks</label><div class="chips">${chipSet(DRINKS, 'snack.drinks', S.snack.drinks)}</div></div>
    </section>
    <section class="sec"><h2>Language and sound</h2>
      <div class="row"><label>Kids' screens in</label><select data-set="lang">${opts([['en', 'English'], ['fr', 'Français']], S.lang)}</select></div>
      <div class="row"><label>Read things out loud</label><input type="checkbox" class="tog" data-set="voice" ${S.voice ? 'checked' : ''}></div>
      <div class="row"><label>Sound effects</label><input type="checkbox" class="tog" data-set="sound" ${S.sound ? 'checked' : ''}></div>
    </section>`;
}
function setShare() {
  return `<section class="sec"><h2>Share with the other iPad</h2>
      <p class="small">Set things up once, then send this link to the other iPad (AirDrop or Messages). Opening it there copies these settings, PIN and picture key included. "Who uses this iPad" stays separate on each one.</p>
      <div class="row"><span></span><button class="btn small go" data-act="share">Share setup link</button></div>
    </section>
    <section class="sec"><h2>PIN</h2><div class="row"><span class="small">Change the 4-digit grown-up PIN.</span><button class="btn small" data-act="changePin">Change PIN</button></div></section>`;
}

/* ---------- actions ---------- */
let pendingImport = null;
const ACTIONS = {
  noop() {},
  resume() { go('pick'); },
  respin() {
    const kid = curKid(); const s = loadState(kid.id);
    if (!s.pending || (s.respins || 0) >= (Number(kid.respins) || 0)) return;
    s.respins = (s.respins || 0) + 1; s.pending = null; saveState(kid.id, s); ui.sel = null;
    startSpin(); if (ui.screen !== 'spin') go('home');
  },
  setTab(el) { ui.setTab = el.dataset.t; render(); window.scrollTo(0, 0); },
  resetAll() { S.kids.forEach(k => { const s = loadState(k.id); saveState(k.id, newDayState(new Date(), s.history)); }); toast('Fresh start for everyone'); keepScroll(); },
  refreshArt() { ART = {}; store.set(K_ART, ART); ui.artErr = false; allShows(S).forEach(artFor); toast('Loading pictures'); keepScroll(); },
  who() { go('who'); },
  kid(el) { openKid(el.dataset.id); say(L().hi(S.kids.find(k => k.id === el.dataset.id).name)); },
  home() { if (!ui.spinning) { ui.spin = null; go('home'); } },
  start() { startSpin(); },
  wheelspin() {
    if (ui.spinning) return; const res = commitSpin(); if (!res) return render();
    ui.spinning = true; lockSpinUI();
    spinWheelTo(res.theme, () => {
      ui.spinning = false;
      const g = document.querySelector(`.slice[data-key="${res.theme}"]`); if (g) g.classList.add('win');
      setTimeout(() => reveal(res.theme), 450);
    });
  },
  crank() {
    if (ui.spinning) return; const res = commitSpin(); if (!res) return render();
    ui.spinning = true; lockSpinUI();
    $('#gumball').classList.add('turn');
    [0, 270, 540, 810].forEach(t => setTimeout(sfx.tick, t));
    setTimeout(() => { const p = $('#prize'); p.style.background = THEMES[res.theme].color; p.classList.add('drop'); sfx.clunk(); }, 1150);
    setTimeout(() => { ui.spinning = false; reveal(res.theme); }, 2300);
  },
  card(el) {
    if (ui.spinning) return; const res = commitSpin(); if (!res) return render();
    ui.spinning = true; lockSpinUI();
    const i = Number(el.dataset.i), cards = [...document.querySelectorAll('.pcard')];
    const pool = ui.spin.opts.map(o => o.key);
    const others = shuffle(pool.filter(k => k !== res.theme));
    cards.forEach((c, j) => fillFront(c, j === i ? res.theme : (others.shift() || pickOne(pool))));
    cards[i].classList.add('flipped'); sfx.flip();
    setTimeout(() => { cards.forEach((c, j) => { if (j !== i) c.classList.add('flipped', 'dim'); }); sfx.flip(); }, 950);
    setTimeout(() => { ui.spinning = false; reveal(res.theme); }, 2100);
  },
  pickShow(el) {
    ui.sel = el.dataset.id; const sh = showById(ui.sel, S); render(); sfx.pop();
    if (sh) say(titleOf(sh));
    setTimeout(() => { const d = $('.dose'); if (d && d.scrollIntoView) d.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 60);
  },
  watch(el) {
    const kid = curKid(); const s = loadState(kid.id); const p = s.pending; const sh = showById(el.dataset.id, S);
    if (!p || !sh) return;
    const link = linkFor(sh, S); recordWatch(s, sh, dose(sh, p.remaining), link, Date.now()); saveState(kid.id, s);
    setTimeout(() => { ui.sel = null; go('home'); }, 600);   // the link itself opens the app
  },
  watchYT(el) {
    const kid = curKid(); const s = loadState(kid.id); const sh = showById(el.dataset.id, S); if (!sh || !sh.ytId) return;
    if (!el.dataset.again && s.pending) { recordWatch(s, sh, dose(sh, s.pending.remaining), linkFor(sh, S), Date.now()); saveState(kid.id, s); ui.sel = null; }
    openPlayer(sh);
  },
  closePlayer() { closeOverlay(); go('home'); },
  dealerGo(el) {
    const kid = curKid(); const s = loadState(kid.id); const p = s.pending; if (!p) return;
    recordDealer(s, p.remaining, el.dataset.p, Date.now()); saveState(kid.id, s);
    setTimeout(() => go('home'), 600);
  },
  snack() { openSnack(); },
  closeOverlay() { closeOverlay(); },
  parent() { ui.pin = { mode: S.pin ? 'enter' : 'gate', buf: '', first: '', q: null }; go('pin'); },
  pinCancel() { ui.pin = null; ui.kidId && curKid() ? go('home') : go('who'); },
  pin(el) {
    const P = ui.pin, d = el.dataset.d;
    if (d === 'del') { P.buf = P.buf.slice(0, -1); return render(); }
    P.buf += d;
    const need = P.mode === 'gate' ? String(P.q[0] * P.q[1]).length : 4;
    if (P.buf.length < need) return render();
    if (P.mode === 'gate') { if (Number(P.buf) === P.q[0] * P.q[1]) { P.mode = 'new1'; P.buf = ''; } else return pinFail(); }
    else if (P.mode === 'enter') { if (hashPin(P.buf) === S.pin) { ui.pin = null; return go('settings'); } return pinFail(); }
    else if (P.mode === 'new1') { P.first = P.buf; P.buf = ''; P.mode = 'new2'; }
    else if (P.buf === P.first) { S.pin = hashPin(P.buf); saveSettings(); ui.pin = null; toast('PIN saved'); return go('settings'); }
    else { P.mode = 'new1'; P.buf = ''; P.first = ''; toast("Those didn't match. Try again."); }
    render();
  },
  changePin() { ui.pin = { mode: 'new1', buf: '', first: '', q: null }; go('pin'); },
  exitSettings() { const dev = store.get(K_DEV, null); if (dev && S.kids.some(k => k.id === dev)) openKid(dev); else if (ui.kidId && curKid()) go('home'); else go('who'); },
  addKid() {
    if (S.kids.length >= 4) return;
    let n = S.kids.length + 1; while (S.kids.some(k => k.id === 'k' + n)) n++;
    S.kids.push(defaultKid('k' + n, 'Kid ' + (S.kids.length + 1), AVATARS[(S.kids.length + 2) % AVATARS.length], 5)); saveSettings(); keepScroll();
  },
  removeKid(el) {
    const k = S.kids[Number(el.dataset.i)]; if (!k || S.kids.length < 2) return;
    if (!confirm(`Remove ${k.name}?`)) return;
    S.kids.splice(Number(el.dataset.i), 1); saveSettings(); store.del('popcorn.state.' + k.id);
    if (store.get(K_DEV, null) === k.id) store.del(K_DEV);
    if (ui.kidId === k.id) ui.kidId = null; keepScroll();
  },
  resetToday(el) {
    const s = loadState(el.dataset.id); saveState(el.dataset.id, newDayState(new Date(), s.history)); toast('Today was reset'); keepScroll();
  },
  delShow(el) { S.custom = S.custom.filter(c => c.id !== el.dataset.id); delete S.hidden[el.dataset.id]; saveSettings(); refreshShowList(); },
  jw() { const q = ($('#jwq').value || '').trim(); window.open('https://www.justwatch.com/ca/search?q=' + encodeURIComponent(q), '_blank', 'noopener'); },
  addShow() {
    const t = $('#af-t').value.trim(); if (!t) { toast('Add a title first'); return; }
    const plat = $('#af-p').value, th = $('#af-th').value, lang = $('#af-lang').value;
    let url = $('#af-l').value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!url) url = PLATFORMS[plat].search ? PLATFORMS[plat].search.replace('{q}', encodeURIComponent(t)) : PLATFORMS[plat].home;
    let a0 = Number($('#af-a0').value), a1 = Number($('#af-a1').value); if (a1 < a0) [a0, a1] = [a1, a0];
    const themes = [th]; if (lang === 'fr' && th !== 'french') themes.push('french');
    S.custom.push({ id: 'c-' + Date.now().toString(36), t, e: ($('#af-e').value || '📺').trim() || '📺', lang, th: themes, a: [a0, a1],
      p: Number($('#af-pace').value), m: clamp(Number($('#af-m').value) || 15, 3, 120), l: { [plat]: url }, why: 'Added by you.', custom: true });
    saveSettings(); toast(`${t} added`); keepScroll();
  },
  async share() {
    const url = location.origin + location.pathname + '#setup=' + encodeSetup(S);
    try { if (navigator.share) { await navigator.share({ title: 'Popcorn setup', url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Setup link copied'); } catch (e) { window.prompt('Copy this link:', url); }
  },
  importYes() {
    S = mergeSettings(pendingImport); saveSettings(); pendingImport = null; closeOverlay(); toast('Settings copied. Now pick who uses this iPad.');
    ACTIONS.parent();   // PIN first, then settings, so a curious kid can't wander in
  },
  importNo() { pendingImport = null; closeOverlay(); render(); },
};
function keepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function setPath(obj, path, v) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }

document.addEventListener('pointerdown', unlock, { passive: true });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  unlock();
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.device) { if (el.value) store.set(K_DEV, el.value); else store.del(K_DEV); toast('Saved'); return; }
  if (el.dataset.show) { if (el.checked) delete S.hidden[el.dataset.show]; else S.hidden[el.dataset.show] = true; saveSettings(); return; }
  if (!el.dataset.set) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.type === 'num') v = Number(v);
  if (el.dataset.set.endsWith('.name')) v = String(v).trim() || 'Kid';
  setPath(S, el.dataset.set, v); saveSettings();
  if (el.dataset.set === 'tmdbKey') { ART = {}; store.set(K_ART, ART); ui.artErr = false; allShows(S).forEach(artFor); }
  keepScroll();
});
document.addEventListener('input', e => { if (e.target.dataset.input === 'showQ') { ui.showQ = e.target.value; refreshShowList(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ['home', 'who'].includes(ui.screen)) render(); });
setInterval(() => { if (ui.screen === 'home' && !$('#layer').children.length) render(); }, 20000);

/* ---------- start ---------- */
(function boot() {
  const m = location.hash.match(/setup=([A-Za-z0-9_-]+)/);
  if (m) {
    try { pendingImport = decodeSetup(m[1]); } catch (e) { pendingImport = null; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  const dev = store.get(K_DEV, null);
  if (dev && S.kids.some(k => k.id === dev)) { ui.kidId = dev; ui.screen = 'home'; }
  render();
  if (pendingImport) {
    overlay(`<div class="dialog"><h2>Copy these settings?</h2><p>This replaces the Popcorn settings on this iPad with the ones from the link.</p>
      <div class="dose-actions"><button class="btn" data-act="importNo">Cancel</button><button class="btn go" data-act="importYes">Copy them</button></div></div>`, 'dialogwrap');
  }
})();
</script>
</body>
</html>
