<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twrlzy">
<meta name="theme-color" content="#0B0E2A">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>Twrlzy</title>
<style>
/* Fredoka is self-hosted (SIL Open Font License, see fonts/OFL.txt) so the app works offline and loads nothing from Google. */
@font-face{font-family:"Fredoka"; font-style:normal; font-weight:500; font-display:swap; src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2");}
@font-face{font-family:"Fredoka"; font-style:normal; font-weight:600; font-display:swap; src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2");}
@font-face{font-family:"Fredoka"; font-style:normal; font-weight:700; font-display:swap; src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2");}

/* Design tokens: "Modern Cosmic", toned down to stay calm (one glow per screen, no constant motion). */
:root{
  --bg0:#090B19; --bg1:#0B0E2A; --bg2:#151035;
  --teal:#00F2FE; --violet:#7B3FE4; --coral:#FF5A79; --gold:#FFC72C; --green:#3CE086;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.11); --line:rgba(255,255,255,.15); --line2:rgba(255,255,255,.08);
  --ink:#F4F2FF; --ink2:#B9B6E3; --ink3:#8784B5; --alt:#7FE9FF; --gold-ink:#3A2A00;
  --r-sm:16px; --r-md:24px; --r-lg:36px; --r-xl:48px;
  --ease:cubic-bezier(.25,1,.5,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --font:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-family:var(--font); color-scheme:dark;
}
*{box-sizing:border-box; touch-action:manipulation;}
html,body{margin:0; min-height:100%;}
body{background:var(--bg1); color:var(--ink); -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; overscroll-behavior:none; font-weight:500;}
body::before{content:''; position:fixed; inset:0; z-index:-2; pointer-events:none; background:
  radial-gradient(900px 600px at 6% 108%, rgba(0,242,254,.10), transparent 60%),
  radial-gradient(1000px 720px at 102% -8%, rgba(123,63,228,.30), transparent 60%),
  radial-gradient(760px 520px at 88% 98%, rgba(255,90,121,.09), transparent 60%),
  linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);}
body::after{content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.55;
  background-image:
    radial-gradient(1.3px 1.3px at 24px 36px, #fff 50%, transparent 52%),
    radial-gradient(1px 1px at 150px 84px, rgba(255,255,255,.85) 50%, transparent 52%),
    radial-gradient(1.7px 1.7px at 92px 170px, rgba(200,230,255,.9) 50%, transparent 52%),
    radial-gradient(1px 1px at 214px 214px, rgba(255,255,255,.6) 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 262px 120px, rgba(255,230,200,.75) 50%, transparent 52%);
  background-size:300px 300px; animation:twinkle 9s ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:.35}to{opacity:.65}}
#app{min-height:100vh; display:flex; flex-direction:column;}
.screen{flex:1; width:100%; max-width:1180px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:calc(14px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));}
:where(button, a.btn, a.plat){font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-decoration:none;}
button:disabled{opacity:.45; pointer-events:none;}
.glass{background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);}
.alt{display:block; font-size:.56em; font-weight:600; color:var(--alt); margin-top:2px; letter-spacing:0;}
.hero{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center;}
.h-title{margin:0; font-size:clamp(28px, 4.2vw, 44px); font-weight:700; line-height:1.1; text-align:center; letter-spacing:.2px;}
.sub{margin:0; font-size:21px; color:var(--ink2);}
.hint{margin:0; font-size:17px; color:var(--ink3);}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:0 30px; border-radius:999px;
  font-size:23px; font-weight:700; color:var(--ink); background:var(--glass2); border:1px solid var(--line); transition:transform .14s var(--ease), box-shadow .2s;}
.btn:active{transform:scale(.97);}
.btn .alt{font-size:.6em; margin:0;}
.btn.primary{background:linear-gradient(135deg, #00C6EE, #7B3FE4); border:0; color:#fff; box-shadow:0 10px 26px rgba(80,90,255,.32);}
.btn.go{background:linear-gradient(135deg, #FFD25A, #FF9F45); border:0; color:var(--gold-ink); box-shadow:0 10px 26px rgba(255,170,60,.28);}
.btn.go .alt{color:#6B4A00;}
.btn.big{min-height:88px; font-size:31px; padding:0 44px; flex-direction:row;}
.btn.big .lbl{display:flex; flex-direction:column; align-items:flex-start; line-height:1.05;}
.btn.small{min-height:44px; font-size:16px; padding:0 18px;}
.btn.danger{background:rgba(255,90,121,.14); color:#FFB3C1; border-color:rgba(255,90,121,.35);}
.iconbtn{width:56px; height:56px; border-radius:50%; background:var(--glass2); border:1px solid var(--line); display:grid; place-items:center; font-size:24px; flex:none; color:var(--ink);}
.iconbtn.sm{width:40px; height:40px; font-size:17px;}
.iconbtn.ghost{visibility:hidden;}
.topbar{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px;}
.row-btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

/* kid header: parent lock + language | wordmark | Nova */
.kidtop{width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:12px;}
.kidtop .l{display:flex; flex-direction:column; gap:10px; align-items:flex-start;}
.kidtop .c{padding-top:4px;}
.kidtop .r{display:flex; justify-content:flex-end; align-items:flex-start; gap:6px;}
.lock{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:10px; min-height:52px; padding:0 18px 0 14px; border-radius:999px;
  font-size:16px; font-weight:600; color:var(--ink); text-align:left; line-height:1.15;}
.lock small{display:block; font-size:12px; color:var(--ink3); font-weight:500;}
.lock .fill{position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,242,254,.35), rgba(123,63,228,.45)); transform:scaleX(0); transform-origin:left; pointer-events:none;}
.lock.holding .fill{transition:transform 1.2s linear; transform:scaleX(1);}
.lock > *:not(.fill){position:relative;}
.lang{display:inline-flex; border-radius:999px; padding:4px; gap:2px;}
.lang button{min-width:64px; min-height:48px; border-radius:999px; font-weight:700; font-size:19px; color:var(--ink2);}
.lang button.on{background:var(--teal); color:#04313A; box-shadow:0 0 14px rgba(0,242,254,.45);}
.wordmark{width:clamp(150px, 24vw, 290px); height:auto; display:block; overflow:visible;
  filter:drop-shadow(0 0 8px rgba(0,242,254,.35)) drop-shadow(0 0 20px rgba(156,124,255,.22));}
.nova{width:clamp(70px, 9.5vw, 110px); height:auto; flex:none; animation:float 5s ease-in-out infinite; filter:drop-shadow(0 6px 18px rgba(127,168,255,.35));}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{max-width:200px; padding:10px 14px; border-radius:18px 18px 4px 18px; font-size:15px; font-weight:600; line-height:1.25; text-align:center; margin-top:14px;}
.bubble .alt{font-size:.85em;}

/* kid bar: avatar + screen ticket */
.kidbar{width:100%; max-width:860px; display:flex; align-items:center; justify-content:space-between; gap:14px 18px; padding:12px 16px 12px 12px; border-radius:var(--r-lg); flex-wrap:wrap;}
.kidbar .who{display:flex; align-items:center; gap:14px; text-align:left;}
.kidbar .nm{display:block; font-size:25px; font-weight:700; line-height:1.1;}
.kidbar .ag{display:block; font-size:15px; color:#9AA8FF; margin-top:3px;}
.ticket{display:flex; align-items:center; gap:12px; padding:10px 16px; border-radius:20px; border:1.5px solid rgba(255,199,44,.55);
  background:rgba(255,199,44,.07); box-shadow:0 0 18px rgba(255,199,44,.12); text-align:left;}
.ticket .tk-l{font-size:17px; font-weight:700;}
.ticket .tk-s{font-size:14px; color:var(--ink2);}
.ticket .bar{height:6px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:6px; width:150px;}
.ticket .bar i{display:block; height:100%; background:linear-gradient(90deg, var(--gold), #FF905A); border-radius:6px;}
.ring{--rc:var(--teal); width:76px; height:76px; border-radius:50%; display:grid; place-items:center; font-size:44px; flex:none;
  background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.16), rgba(255,255,255,.03) 70%);
  border:3px solid var(--rc); box-shadow:0 0 0 6px color-mix(in srgb, var(--rc) 16%, transparent), 0 0 26px color-mix(in srgb, var(--rc) 30%, transparent);}
.ring.xl{width:min(210px, 24vw); height:min(210px, 24vw); min-width:130px; min-height:130px; font-size:min(112px, 13vw); border-width:5px;
  box-shadow:0 0 0 10px color-mix(in srgb, var(--rc) 14%, transparent), 0 0 46px color-mix(in srgb, var(--rc) 34%, transparent);}

/* who's watching */
.kids{display:flex; flex-wrap:wrap; gap:clamp(24px, 5vw, 64px); justify-content:center; margin-top:2vh;}
.kid{display:flex; flex-direction:column; align-items:center; gap:18px; transition:transform .2s var(--ease-pop);}
.kid:active{transform:scale(.96);}
.kname{font-size:26px; font-weight:700;}
.kname span{opacity:.75; font-weight:600;}

/* status card (waiting, done, chosen) */
.status{border-radius:var(--r-lg); padding:26px 26px 24px; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:560px;}
.s-title{font-size:30px; font-weight:700; line-height:1.15;}
.s-sub{font-size:20px; color:var(--ink2);}
.idea{font-size:24px; font-weight:600; background:var(--glass); border:1px solid var(--line2); border-radius:20px; padding:14px 18px;}
.bonus{background:rgba(60,224,134,.12); color:#9BF5C8; padding:9px 18px; border-radius:999px; font-weight:600; font-size:17px; border:1px solid rgba(60,224,134,.3);}
.bonus .alt{display:inline; margin-left:6px; font-size:.85em; color:#9BF5C8; opacity:.8;}
.s-art{width:100%; max-width:440px; aspect-ratio:16/9; border-radius:22px; background-size:cover; background-position:center; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.s-art-fb{display:grid; place-items:center; background:linear-gradient(135deg, #3A2A9C, #151035); font-size:84px;}
.th-badge{--c:var(--violet); width:112px; height:112px; border-radius:50%; background:var(--c); display:grid; place-items:center; flex:none;
  box-shadow:0 0 0 8px color-mix(in srgb, var(--c) 22%, transparent), 0 0 40px color-mix(in srgb, var(--c) 45%, transparent);}
.th-badge.sm{width:48px; height:48px; box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent);}
.th-badge.xl{width:150px; height:150px;}

/* wheel */
.wheel-wrap{position:relative; width:min(80vw, calc(100vh - 350px), 600px); min-width:250px; aspect-ratio:1; margin:6px auto 0;}
#wheel{width:100%; height:100%; transform-origin:50% 50%; display:block; filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));}
#wheel text{pointer-events:none;}
.sl-t{font-family:var(--font); font-weight:600; fill:#fff; paint-order:stroke; stroke:rgba(20,16,60,.25); stroke-width:3px;}
.slice.win{filter:brightness(1.18);}
.pointer{position:absolute; left:50%; top:-14px; transform:translateX(-50%); width:0; height:0; z-index:2;
  border-left:20px solid transparent; border-right:20px solid transparent; border-top:36px solid var(--teal); filter:drop-shadow(0 0 8px rgba(0,242,254,.7));}
.hub{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:30%; aspect-ratio:1; border-radius:50%; z-index:3;
  background:radial-gradient(circle at 50% 32%, #22346E, #0E1538 72%); border:3px solid var(--teal); color:#fff;
  font-size:clamp(17px, 3vw, 28px); font-weight:700; line-height:1.05; box-shadow:0 0 0 7px rgba(0,242,254,.12), 0 0 30px rgba(0,242,254,.35);
  display:flex; flex-direction:column; align-items:center; justify-content:center;}
.hub .alt{font-size:.62em; color:var(--alt);}
.hub:disabled{opacity:1;}

/* gumball */
.gumball{position:relative; width:min(62vw, calc((100vh - 420px) * .7), 430px); min-width:200px; aspect-ratio:300/430;}
.gumball svg{width:100%; height:100%; display:block; filter:drop-shadow(0 18px 36px rgba(0,0,0,.45));}
#crank{transform-box:fill-box; transform-origin:center;}
.turn #crank{animation:crank 1.1s var(--ease);}
@keyframes crank{to{transform:rotate(360deg);}}
.turn #balls{animation:shake .12s linear 9;}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px)}100%{transform:translate(0,0)}}
.prize{position:absolute; width:12%; aspect-ratio:1; border-radius:50%; left:44%; top:84.5%; opacity:0;
  box-shadow:inset -5px -6px 0 rgba(0,0,0,.18), inset 5px 5px 0 rgba(255,255,255,.45), 0 0 18px rgba(255,255,255,.35);}
.prize.drop{animation:drop .9s var(--ease-pop) forwards;}
@keyframes drop{0%{opacity:0; transform:translateY(-40%) scale(.5)}35%{opacity:1}100%{opacity:1; transform:translateY(55%) scale(1.15)}}

/* cards */
.cards3{display:flex; gap:clamp(14px, 3vw, 30px); justify-content:center; perspective:1200px; margin-top:2vh; flex-wrap:wrap;}
.pcard{width:min(26vw, calc((100vh - 400px) * .75), 250px); min-width:120px; aspect-ratio:3/4; position:relative; padding:0;}
.pcard .inner{position:absolute; inset:0; transition:transform .7s var(--ease-pop); transform-style:preserve-3d;
  animation:wobble 3.2s ease-in-out infinite; animation-delay:calc(var(--i) * .4s);}
.pcard.flipped .inner{animation:none; transform:rotateY(180deg);}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.pcard .face{position:absolute; inset:0; border-radius:26px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; box-shadow:0 16px 34px rgba(0,0,0,.4);}
.pcard .back{border:2px solid rgba(255,255,255,.22);
  background:radial-gradient(circle at 22% 18%, rgba(255,255,255,.5) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 78% 30%, rgba(255,255,255,.4) 0 1.2px, transparent 2.2px),
    radial-gradient(circle at 30% 82%, rgba(255,255,255,.35) 0 1.4px, transparent 2.4px),
    radial-gradient(circle at 72% 76%, rgba(255,255,255,.45) 0 1.2px, transparent 2.2px),
    linear-gradient(160deg, #5B3FD9, #2B1F7A);}
.pcard .back svg{width:46%; height:auto; filter:drop-shadow(0 0 12px rgba(255,199,44,.5));}
.pcard .front{transform:rotateY(180deg); background:var(--c, #fff); color:#fff;}
.pcard .fn{font-size:clamp(17px, 2.4vw, 23px); font-weight:700; text-align:center; padding:0 10px;}
.pcard.dim{opacity:.45; transform:scale(.93); transition:opacity .4s, transform .4s;}

/* overlays */
#layer{position:relative; z-index:40;}
.overlay{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px;
  background:rgba(6,8,24,.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); animation:fade .25s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reveal-card{border-radius:var(--r-xl); padding:34px 56px 30px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
  background:rgba(255,255,255,.08); border:1px solid var(--line); animation:popin .6s var(--ease-pop);}
.r-label{font-size:22px; font-weight:600; color:var(--ink2); margin-top:12px;}
.r-name{font-size:clamp(36px, 6vw, 54px); font-weight:700; line-height:1.05;}
@keyframes popin{from{transform:scale(.4); opacity:0}to{transform:scale(1); opacity:1}}
.confetti{position:fixed; top:-24px; width:14px; height:14px; z-index:60; pointer-events:none; animation:fall linear forwards;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);}}
.dialog, .snackbox{border-radius:32px; padding:26px; max-width:520px; width:100%; text-align:center; display:flex; flex-direction:column; gap:16px; align-items:center;
  background:rgba(22,20,60,.92); border:1px solid var(--line);}
.dialog h2, .snackbox h2{margin:0; font-size:28px;}
.dialog p{margin:0; font-size:18px; color:var(--ink2);}
.toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(14,12,40,.94); color:var(--ink);
  border:1px solid var(--line); padding:13px 22px; border-radius:999px; font-size:17px; font-weight:600; z-index:70; box-shadow:0 10px 30px rgba(0,0,0,.45); transition:opacity .4s;}
.toast.out{opacity:0;}

/* pick a show */
.pickbar{width:100%; display:grid; grid-template-columns:56px 1fr 56px; align-items:center; gap:12px;}
.pickhead{display:flex; align-items:center; justify-content:center; gap:12px; font-size:clamp(22px, 3.4vw, 30px); font-weight:700; text-align:left; line-height:1.1;}
.pickhead .alt{font-size:.6em;}
.shows{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:18px; width:100%; max-width:1000px;}
.show{border-radius:28px; padding:12px 12px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  background:var(--glass); border:2px solid var(--line2); transition:transform .18s var(--ease), border-color .18s, box-shadow .18s;}
.show.on{border-color:var(--teal); transform:translateY(-4px); box-shadow:0 0 0 4px rgba(0,242,254,.12), 0 16px 36px rgba(0,0,0,.35);}
.s-em{width:100%; aspect-ratio:16/9; border-radius:20px; display:grid; place-items:center; background:linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 35%, #151035));}
.s-emo{font-size:clamp(54px, 7vw, 76px); line-height:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));}
.s-em.has-art{background-size:cover; background-position:center;}
.show .s-t{font-size:22px; font-weight:700; line-height:1.15; padding:0 4px;}
.s-meta{font-size:15px; color:var(--ink2); display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;}
.pchip{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--ink); font-size:14px; font-weight:600;}
.pchip i{width:8px; height:8px; border-radius:50%;}
.pill{display:inline-block; padding:4px 12px; border-radius:999px; font-size:14px; font-weight:700; color:#fff; white-space:nowrap;}
.dose{position:sticky; bottom:calc(10px + env(safe-area-inset-bottom)); width:100%; max-width:780px; border-radius:var(--r-lg); padding:20px 22px;
  display:flex; flex-direction:column; align-items:center; gap:10px; background:rgba(26,22,70,.86); box-shadow:0 -10px 40px rgba(0,0,0,.45); animation:up .3s var(--ease); z-index:5;}
@keyframes up{from{transform:translateY(30px); opacity:0}to{transform:none; opacity:1}}
.dose-big{font-size:clamp(26px, 4.6vw, 36px); font-weight:700; line-height:1.1;}
.eps{display:flex; gap:7px;}
.eps i{width:16px; height:16px; border-radius:6px; background:linear-gradient(135deg, var(--teal), #7B8BFF); box-shadow:0 0 10px rgba(0,242,254,.35);}
.dose-sub{font-size:17px; color:var(--ink2);}
.dose-actions{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:4px;}

/* your pick (any app) */
.plats{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:860px;}
.plat{min-width:210px; min-height:80px; padding:0 24px; border-radius:24px; background:var(--glass2); border:1px solid var(--line); color:var(--ink);
  font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px;}
.plat i{width:14px; height:14px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c);}

/* snack spin */
.slot{display:flex; gap:14px; padding:14px; border-radius:28px; background:rgba(0,0,0,.25); border:2px solid rgba(255,199,44,.6); box-shadow:0 0 24px rgba(255,199,44,.15);}
.reel{width:118px; height:118px; overflow:hidden; border-radius:20px; background:#F4F2FF;}

const MECHS = ['wheel', 'gumball', 'cards'];
const DEALER_W = [0, 0.5, 1, 2];     // off, small, normal, big
const MAX_EP = 6;                     // never more than 6 episodes in one go
const BONUS_MIN = 15;                 // 15+ minutes left over earns a bonus spin
const FIT_SLACK = 5;                  // a show fits if one episode is at most 5 min over what's left

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayNumber(d) { return Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime() / 86400000); }

function defaultKid(id, name, emoji, age) {
  return { id, name, emoji, age, minutes: 60, maxPace: 2, mech: 'rotate', dealer: 1, respins: 1,
    themes: Object.fromEntries(THEME_KEYS.map(k => [k, true])) };
}
function defaultSettings() {
  return {
    v: 1, lang: 'en', voice: true, sound: true, linkMode: 'blank', youtube: 'app', tmdbKey: '',
    platforms: Object.fromEntries(PLATFORM_ORDER.map(k => [k, !!PLATFORMS[k].def])),
    kids: [defaultKid('k1', 'Kid 1', '🦊', 6), defaultKid('k2', 'Kid 2', '🐻', 4)],
    snack: { on: true, drink: true,
      snacks: Object.fromEntries(Object.keys(SNACKS).map(k => [k, true])),
      drinks: Object.fromEntries(Object.keys(DRINKS).map(k => [k, true])) },
    hidden: {}, custom: [], pin: null,
  };
}
function mergeSettings(saved) {
  const d = defaultSettings();
  if (!saved || typeof saved !== 'object') return d;
  const s = Object.assign(defaultSettings(), saved);
  s.platforms = Object.assign(d.platforms, saved.platforms || {});
  const sn = saved.snack || {};
  s.snack = Object.assign(defaultSettings().snack, sn);
  s.snack.snacks = Object.assign(d.snack.snacks, sn.snacks || {});
  s.snack.drinks = Object.assign(d.snack.drinks, sn.drinks || {});
  s.hidden = (saved.hidden && typeof saved.hidden === 'object') ? saved.hidden : {};
  s.tmdbKey = typeof saved.tmdbKey === 'string' ? saved.tmdbKey : '';
  s.custom = Array.isArray(saved.custom) ? saved.custom.filter(c => c && c.id && c.t && c.l && c.th && c.a) : [];
  const kids = Array.isArray(saved.kids) && saved.kids.length ? saved.kids.slice(0, 4) : d.kids;
  s.kids = kids.map((k, i) => {
    const base = defaultKid(k.id || ('k' + (i + 1)), k.name || ('Kid ' + (i + 1)), k.emoji || '🙂', Number(k.age) || 5);
    const out = Object.assign(base, k);
    out.age = Number(out.age) || 5; out.minutes = Number(out.minutes) || 60;
    out.maxPace = Number(out.maxPace) || 2; out.dealer = Number.isFinite(Number(out.dealer)) ? Number(out.dealer) : 1;
    out.respins = Number.isFinite(Number(out.respins)) ? Number(out.respins) : 1;
    out.themes = Object.assign(Object.fromEntries(THEME_KEYS.map(t => [t, true])), k.themes || {});
    return out;
  });
  return s;
}

function allShows(settings) { return SHOWS.concat(settings.custom || []); }
function showById(id, settings) { return allShows(settings).find(s => s.id === id) || null; }
function linkFor(show, settings) {
  if (!show || !show.l) return null;
  for (const k of PLATFORM_ORDER) if (settings.platforms[k] && show.l[k]) return { platform: k, url: show.l[k] };
  return null;
}
function eligible(show, kid, settings) {
  if (!show || settings.hidden[show.id]) return false;
  if (!linkFor(show, settings)) return false;
  const age = Number(kid.age);
  if (age < show.a[0] || age > show.a[1]) return false;
  if (show.p > Number(kid.maxPace)) return false;
  return true;
}
function fits(show, remaining) { return show.m <= remaining + FIT_SLACK; }
function showsForTheme(theme, kid, settings, remaining) {
  return allShows(settings).filter(s => s.th.includes(theme) && eligible(s, kid, settings) && fits(s, remaining));
}
function anyPlatformOn(settings) { return PLATFORM_ORDER.some(k => settings.platforms[k]); }
function themeOptions(kid, settings, remaining) {
  const out = [];
  THEME_KEYS.forEach(k => {
    if (!kid.themes[k]) return;
    const n = showsForTheme(k, kid, settings, remaining).length;
    if (n > 0) out.push({ key: k, w: 1, n });
  });
  const dw = DEALER_W[kid.dealer] || 0;
  if (dw > 0 && out.length && anyPlatformOn(settings)) out.push({ key: 'dealer', w: dw, n: 0 });
  return out;
}
function weightedPick(items, rand) {
  rand = rand || Math.random;
  const total = items.reduce((a, i) => a + i.w, 0);
  let r = rand() * total;
  for (const it of items) { r -= it.w; if (r < 0) return it; }
  return items[items.length - 1];
}
function dose(show, remaining) {
  const n = clamp(Math.floor(remaining / show.m), 1, MAX_EP);
  const minutes = n * show.m;
  const left = Math.max(0, remaining - minutes);
  return { n, minutes, bonus: left >= BONUS_MIN ? left : 0 };
}
function sampleShows(list, k, history, rand) {
  rand = rand || Math.random;
  const recent = new Set((history || []).slice(-6));
  return list.map(s => ({ s, r: rand() + (recent.has(s.id) ? 1 : 0) }))
    .sort((a, b) => a.r - b.r).slice(0, k).map(x => x.s);
}
function mechanicFor(kid, kidIdx, date, spins) {
  if (kid.mech && kid.mech !== 'rotate') return kid.mech;
  const n = dayNumber(date) + kidIdx + (spins || 0);
  return MECHS[((n % MECHS.length) + MECHS.length) % MECHS.length];
}
function newDayState(date, history) {
  return { date: dayKey(date), used: 0, spins: 0, respins: 0, bonusLeft: 0, bonusAt: 0, pick: null, pending: null, snack: null, history: history || [] };
}
function spinStatus(kid, s, now) {
  now = now || Date.now();
  if (s.pending) return { kind: 'pending' };
  if (s.spins === 0) return { kind: 'ready', remaining: Number(kid.minutes), bonus: false };
  if (s.bonusLeft > 0) {
    if (now >= s.bonusAt) return { kind: 'ready', remaining: s.bonusLeft, bonus: true };
    return { kind: 'waiting', ms: s.bonusAt - now };
  }
  return { kind: 'done' };
}
function recordWatch(s, show, d, link, now) {
  s.used += d.minutes; s.spins += 1; s.pending = null;
  s.pick = { id: show.id, n: d.n, minutes: d.minutes, url: link.url, platform: link.platform, at: now };
  s.bonusLeft = d.bonus;
  s.bonusAt = d.bonus ? now + Math.round(d.minutes * 0.8) * 60000 : 0;
  s.history = (s.history || []).concat(show.id).slice(-20);
}
function recordDealer(s, remaining, platform, now) {
  s.used += remaining; s.spins += 1; s.pending = null; s.bonusLeft = 0; s.bonusAt = 0;
  s.pick = { id: 'dealer', n: 0, minutes: remaining, platform, url: PLATFORMS[platform].home, at: now };
}
function encodeSetup(settings) {
  const json = JSON.stringify(settings);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeSetup(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(b64 + '==='.slice((b64.length + 3) % 4)))));
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* storage that never throws (private mode, blocked storage) */
const MEM = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return k in MEM ? MEM[k] : d; },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} },
};
const K_SET = 'popcorn.settings', K_DEV = 'popcorn.device';
let S = mergeSettings(store.get(K_SET, null));
function saveSettings() { store.set(K_SET, S); }
function loadState(kidId) {
  const now = new Date();
  let s = store.get('popcorn.state.' + kidId, null);
  if (!s || s.date !== dayKey(now)) { s = newDayState(now, s && s.history); store.set('popcorn.state.' + kidId, s); }
  return s;
}
function saveState(kidId, s) { store.set('popcorn.state.' + kidId, s); }

    else { const k = Math.min(1, (el - wind) / dur), e = 1 - Math.pow(1 - k, 4); rot = (start - back) + (target - start + back) * e; }
    svg.style.transform = `rotate(${rot}deg)`;
    const cur = sliceAt(rot); if (cur !== last) { sfx.tick(); last = cur; }
    if (el < wind + dur) requestAnimationFrame(frame); else { ui.wheelRot = target % 360; done(); }
  }
  requestAnimationFrame(frame);
}

/* ---------- show pictures (TMDB, needs a free key from themoviedb.org) ---------- */
const K_ART = 'popcorn.art';
let ART = store.get(K_ART, {}) || {};
const artQueue = new Set(); let artBusy = false;
function artFor(sh) {
  if (!S.tmdbKey || !sh || ui.artErr) return '';
  const ks = Object.keys(sh.l || {});
  if (ks.length === 1 && ks[0] === 'youtube') return '';          // YouTube channels aren't on TMDB
  if (sh.id in ART) return ART[sh.id];
  artQueue.add(sh.id); setTimeout(pumpArt, 0); return '';
}
function artBox(sh) {
  const a = artFor(sh);
  return a ? `<span class="s-em has-art" style="background-image:url('${esc(a)}')"></span>` : `<span class="s-em"><span class="s-emo">${sh.e}</span></span>`;
}
function heroArt(sh) {
  const a = sh ? artFor(sh) : '';
  return a ? `<div class="s-art" style="background-image:url('${esc(a)}')"></div>` : `<div class="s-art s-art-fb"><span>${sh ? sh.e : '🎲'}</span></div>`;
}
async function lookupArt(sh) {
  const key = S.tmdbKey.trim(), bearer = key.startsWith('eyJ');
  const query = sh.q || sh.t.replace(/\s*\(.*?\)\s*/g, '').trim();
  const url = `https://api.themoviedb.org/3/search/${sh.kind === 'movie' ? 'movie' : 'tv'}?query=${encodeURIComponent(query)}&language=${sh.lang === 'fr' && !sh.q ? 'fr-CA' : 'en-CA'}&include_adult=false`
    + (bearer ? '' : `&api_key=${encodeURIComponent(key)}`);
  const r = await fetch(url, bearer ? { headers: { Authorization: 'Bearer ' + key, accept: 'application/json' } } : {});
  if (!r.ok) { const e = new Error('tmdb ' + r.status); e.status = r.status; throw e; }
  const res = ((await r.json()).results || []);
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
  const best = res.find(x => [x.name, x.title, x.original_name, x.original_title].some(n => norm(n) === norm(query))) || res[0];
  const path = best && (best.backdrop_path || best.poster_path);
  return path ? 'https://image.tmdb.org/t/p/w780' + path : '';
}
async function pumpArt() {
  if (artBusy || typeof fetch !== 'function') return; artBusy = true; let changed = false;
  while (artQueue.size) {
    const id = artQueue.values().next().value; artQueue.delete(id);
    const sh = showById(id, S); if (!sh || id in ART) continue;
    try { ART[id] = await lookupArt(sh); changed = true; }
    catch (e) {
      if (e.status === 401 || e.status === 403) { ui.artErr = true; artQueue.clear(); toast("That TMDB key didn't work"); break; }
      if (e.status === 429) { artQueue.add(id); await new Promise(r => setTimeout(r, 1500)); continue; }
      ART[id] = ''; changed = true;
    }
    store.set(K_ART, ART);
  }
  artBusy = false;
  if (!changed || $('#layer').children.length) return;
  if (ui.screen === 'pick' || (ui.screen === 'home' && !ui.spinning)) render();
  else if (ui.screen === 'settings') refreshShowList();
}

function setServices() {
  const platRows = PLATFORM_ORDER.map(k => {
    const pl = PLATFORMS[k], n = SHOWS.filter(s => s.l[k]).length;
    return `<div class="row"><label><span class="pill" style="background:${pl.color}">${esc(pl.name)}</span> <span class="small">${n} shows${pl.note ? ' · ' + esc(pl.note) : ''}</span></label>
      <input type="checkbox" class="tog" data-set="platforms.${k}" ${S.platforms[k] ? 'checked' : ''} aria-label="${esc(pl.name)}"></div>`;
  }).join('');
  return `<section class="sec"><h2>Streaming services</h2><p class="small">Only shows on the services you turn on can land.</p>${platRows}</section>
    <section class="sec"><h2>Opening shows</h2>
      <div class="row"><label>Open shows in</label><select data-set="linkMode">${opts([['blank', 'A new tab (works best)'], ['self', 'The same tab']], S.linkMode)}</select></div>
      <div class="row"><label>YouTube picks</label><select data-set="youtube">${opts([['app', 'Open the YouTube app'], ['inside', 'Play inside Twrlzy (test first)']], S.youtube)}</select></div>
      <p class="small">Télé-Québec and TFO play in Safari; the others open their apps. Re-run the <a class="link" href="linktest.html">link test</a> anytime.</p>
    </section>`;
}
function setShows() {
  const age = [2, 3, 4, 5, 6, 7, 8, 9, 10].map(a => [a, a]);
  const loaded = Object.values(ART).filter(Boolean).length;
  const artState = !S.tmdbKey ? 'Off' : ui.artErr ? "The key didn't work" : `${loaded} pictures loaded`;
  return `<section class="sec"><h2>Show pictures</h2>
      <p class="small">Paste a free TMDB API key to show each show's real artwork on the cards. Get one at <a class="link" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a> (free account, personal use). YouTube channels keep their emoji.</p>
      <div class="row wrap"><input type="text" placeholder="TMDB API key or read access token" value="${esc(S.tmdbKey)}" data-set="tmdbKey" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn small" data-act="refreshArt" ${S.tmdbKey ? '' : 'disabled'}>Reload pictures</button></div>
      <p class="small">Status: ${artState}. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </section>
    <section class="sec"><h2>Shows</h2>
      <p class="small">Turn off anything you don't want to land. The notes are a starting point, not a professional review.</p>
      <div class="row"><input type="search" placeholder="Search shows" value="${esc(ui.showQ)}" data-input="showQ" style="flex:1"></div>
      <div class="showlist" id="showlist">${showListHTML()}</div>
    </section>
    <section class="sec"><h2>Heard about a new show?</h2>
      <div class="row wrap"><input type="search" id="jwq" placeholder="Show name"><button class="btn small" data-act="jw">Where can we watch it?</button></div>
      <p class="small">Opens JustWatch for Canada so you can see which app has it. Then add it here, with the link if you have it.</p>
      <div class="grid2">
        <label class="span2">Title<input type="text" id="af-t" maxlength="60"></label>
        <label>Emoji<input type="text" id="af-e" value="📺" maxlength="4"></label>
        <label>Theme<select id="af-th">${opts(THEME_KEYS.map(t => [t, THEMES[t].emoji + ' ' + THEMES[t].en]), 'feelings')}</select></label>
        <label>Where<select id="af-p">${opts(PLATFORM_ORDER.map(k => [k, PLATFORMS[k].name]), 'netflix')}</select></label>
        <label>Minutes per episode<input type="number" id="af-m" value="15" min="3" max="120"></label>
        <label class="span2">Link to the show (optional)<input type="url" id="af-l" placeholder="https://"></label>
        <label>Youngest age<select id="af-a0">${opts(age, 3)}</select></label>
        <label>Oldest age<select id="af-a1">${opts(age, 8)}</select></label>
        <label>Pace<select id="af-pace">${opts([[1, 'Calm'], [2, 'Medium'], [3, 'Busy']], 2)}</select></label>
        <label>Language<select id="af-lang">${opts([['en', 'English'], ['fr', 'French']], 'en')}</select></label>
      </div>
      <div class="row"><span class="small">Without a link, the button opens the app's search, or its home screen.</span><button class="btn small go" data-act="addShow">Add show</button></div>
    </section>`;
}
function setExtras() {
  const chipSet = (map, path, state) => Object.keys(map).map(k => `<label class="chip ${state[k] ? 'on' : ''}"><input type="checkbox" hidden data-set="${path}.${k}" ${state[k] ? 'checked' : ''}>${map[k].e} ${map[k].en}</label>`).join('');
  return `<section class="sec"><h2>Snack spin</h2>
      <div class="row"><label>Snack spin after picking a show</label><input type="checkbox" class="tog" data-set="snack.on" ${S.snack.on ? 'checked' : ''}></div>
      <div class="row"><label>Add a drink reel</label><input type="checkbox" class="tog" data-set="snack.drink" ${S.snack.drink ? 'checked' : ''}></div>
      <div class="row col"><label>Snacks</label><div class="chips">${chipSet(SNACKS, 'snack.snacks', S.snack.snacks)}</div></div>
      <div class="row col"><label>Drinks</label><div class="chips">${chipSet(DRINKS, 'snack.drinks', S.snack.drinks)}</div></div>
    </section>
    <section class="sec"><h2>Language and sound</h2>
      <div class="row"><label>Kids' screens in</label><select data-set="lang">${opts([['en', 'English'], ['fr', 'Français']], S.lang)}</select></div>
      <div class="row"><label>Read things out loud</label><input type="checkbox" class="tog" data-set="voice" ${S.voice ? 'checked' : ''}></div>
      <div class="row"><label>Sound effects</label><input type="checkbox" class="tog" data-set="sound" ${S.sound ? 'checked' : ''}></div>
    </section>`;
}
function setShare() {
  return `<section class="sec"><h2>Share with the other iPad</h2>
      <p class="small">Copies everything to the other iPad: kids, services, shows, snacks, the PIN and the picture key. "Keep this iPad on one kid" stays separate.</p>
      <div class="row"><span class="small">1. On this iPad: send the link to yourself (Messages, Notes or AirDrop).</span><button class="btn small go" data-act="share">Share setup link</button></div>
      <div class="row col"><span class="small">2. On the other iPad: copy that link, open Twrlzy from its Home Screen icon, come here and paste it. (The Home Screen app keeps its own settings, separate from Safari, so opening the link in Safari isn't enough.)</span>
        <div class="row wrap" style="width:100%; border:0; padding:0"><input type="url" id="imp" placeholder="Paste the setup link" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn small" data-act="importPaste">Use this link</button></div></div>
    </section>
    <section class="sec"><h2>PIN</h2><div class="row"><span class="small">Change the 4-digit grown-up PIN.</span><button class="btn small" data-act="changePin">Change PIN</button></div></section>`;
}

/* ---------- actions ---------- */
let pendingImport = null;
const ACTIONS = {
  noop() {},
  resume() { go('pick'); },
  respin() {
    const kid = curKid(); const s = loadState(kid.id);
    if (!s.pending || (s.respins || 0) >= (Number(kid.respins) || 0)) return;
    s.respins = (s.respins || 0) + 1; s.pending = null; saveState(kid.id, s); ui.sel = null;
    ui.spin = null; go('home');
  },
  setTab(el) { ui.setTab = el.dataset.t; render(); window.scrollTo(0, 0); },
  resetAll() { S.kids.forEach(k => { const s = loadState(k.id); saveState(k.id, newDayState(new Date(), s.history)); }); toast('Fresh start for everyone'); keepScroll(); },
  refreshArt() { ART = {}; store.set(K_ART, ART); ui.artErr = false; allShows(S).forEach(artFor); toast('Loading pictures'); keepScroll(); },
  who() { switchKid(); },
  setLang(el) { S.lang = el.dataset.l === 'fr' ? 'fr' : 'en'; saveSettings(); render(); say(LANG() === 'fr' ? 'Français' : 'English'); },
  kid(el) { openKid(el.dataset.id); say(L().hi(S.kids.find(k => k.id === el.dataset.id).name)); },
  home() { if (!ui.spinning) { ui.spin = null; go('home'); } },
  start() { startSpin(); },
  wheelspin() {
    if (ui.spinning) return; const res = commitSpin(); if (!res) return render();
    ui.spinning = true; lockSpinUI();
    spinWheelTo(res.theme, () => {
      ui.spinning = false;
      const g = document.querySelector(`.slice[data-key="${res.theme}"]`); if (g) g.classList.add('win');
      setTimeout(() => reveal(res.theme), 450);
    });
  },
  crank() {
    if (ui.spinning) return; const res = commitSpin(); if (!res) return render();
    ui.spinning = true; lockSpinUI();
    $('#gumball').classList.add('turn');
    [0, 270, 540, 810].forEach(t => setTimeout(sfx.tick, t));
    setTimeout(() => { const p = $('#prize'); p.style.background = THEMES[res.theme].color; p.classList.add('drop'); sfx.clunk(); }, 1150);
    setTimeout(() => { ui.spinning = false; reveal(res.theme); }, 2300);
  },
  card(el) {
    if (ui.spinning) return; const res = commitSpin(); if (!res) return render();
    ui.spinning = true; lockSpinUI();
    const i = Number(el.dataset.i), cards = [...document.querySelectorAll('.pcard')];
    const pool = ui.spin.opts.map(o => o.key);
    const others = shuffle(pool.filter(k => k !== res.theme));
    cards.forEach((c, j) => fillFront(c, j === i ? res.theme : (others.shift() || pickOne(pool))));
    cards[i].classList.add('flipped'); sfx.flip();
    setTimeout(() => { cards.forEach((c, j) => { if (j !== i) c.classList.add('flipped', 'dim'); }); sfx.flip(); }, 950);
    setTimeout(() => { ui.spinning = false; reveal(res.theme); }, 2100);
  },
  pickShow(el) {
    ui.sel = el.dataset.id; const sh = showById(ui.sel, S); render(); sfx.pop();
    if (sh) say(titleOf(sh));
    setTimeout(() => { const d = $('.dose'); if (d && d.scrollIntoView) d.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 60);
  },
  watch(el) {
    const kid = curKid(); const s = loadState(kid.id); const p = s.pending; const sh = showById(el.dataset.id, S);
    if (!p || !sh) return;
    const link = linkFor(sh, S); recordWatch(s, sh, dose(sh, p.remaining), link, Date.now()); saveState(kid.id, s);
    setTimeout(() => { ui.sel = null; go('home'); }, 600);   // the link itself opens the app
  },
  watchYT(el) {
    const kid = curKid(); const s = loadState(kid.id); const sh = showById(el.dataset.id, S); if (!sh || !sh.ytId) return;
    if (!el.dataset.again && s.pending) { recordWatch(s, sh, dose(sh, s.pending.remaining), linkFor(sh, S), Date.now()); saveState(kid.id, s); ui.sel = null; }
    openPlayer(sh);
  },
  closePlayer() { closeOverlay(); go('home'); },
  dealerGo(el) {
    const kid = curKid(); const s = loadState(kid.id); const p = s.pending; if (!p) return;
    recordDealer(s, p.remaining, el.dataset.p, Date.now()); saveState(kid.id, s);
    setTimeout(() => go('home'), 600);
  },
  snack() { openSnack(); },
  closeOverlay() { closeOverlay(); },
  parent() { ui.pin = { mode: S.pin ? 'enter' : 'gate', buf: '', first: '', q: null }; go('pin'); },
  pinCancel() { ui.pin = null; ui.kidId && curKid() ? go('home') : go('who'); },
  pin(el) {
    const P = ui.pin, d = el.dataset.d;
    if (d === 'del') { P.buf = P.buf.slice(0, -1); return render(); }
    P.buf += d;
    const need = P.mode === 'gate' ? String(P.q[0] * P.q[1]).length : 4;
    if (P.buf.length < need) return render();
    if (P.mode === 'gate') { if (Number(P.buf) === P.q[0] * P.q[1]) { P.mode = 'new1'; P.buf = ''; } else return pinFail(); }
    else if (P.mode === 'enter') { if (hashPin(P.buf) === S.pin) { ui.pin = null; return go('settings'); } return pinFail(); }
    else if (P.mode === 'new1') { P.first = P.buf; P.buf = ''; P.mode = 'new2'; }
    else if (P.buf === P.first) { S.pin = hashPin(P.buf); saveSettings(); ui.pin = null; toast('PIN saved'); return go('settings'); }
    else { P.mode = 'new1'; P.buf = ''; P.first = ''; toast("Those didn't match. Try again."); }
    render();
  },
  changePin() { ui.pin = { mode: 'new1', buf: '', first: '', q: null }; go('pin'); },
  exitSettings() { const dev = store.get(K_DEV, null); if (dev && S.kids.some(k => k.id === dev)) openKid(dev); else if (ui.kidId && curKid()) go('home'); else go('who'); },
  addKid() {
    if (S.kids.length >= 4) return;
    let n = S.kids.length + 1; while (S.kids.some(k => k.id === 'k' + n)) n++;
    S.kids.push(defaultKid('k' + n, 'Kid ' + (S.kids.length + 1), AVATARS[(S.kids.length + 2) % AVATARS.length], 5)); saveSettings(); keepScroll();
  },
  removeKid(el) {
    const k = S.kids[Number(el.dataset.i)]; if (!k || S.kids.length < 2) return;
    if (!confirm(`Remove ${k.name}?`)) return;
    S.kids.splice(Number(el.dataset.i), 1); saveSettings(); store.del('popcorn.state.' + k.id);
    if (store.get(K_DEV, null) === k.id) store.del(K_DEV);
    if (ui.kidId === k.id) ui.kidId = null; keepScroll();
  },
  resetToday(el) {
    const s = loadState(el.dataset.id); saveState(el.dataset.id, newDayState(new Date(), s.history)); toast('Today was reset'); keepScroll();
  },
  delShow(el) { S.custom = S.custom.filter(c => c.id !== el.dataset.id); delete S.hidden[el.dataset.id]; saveSettings(); refreshShowList(); },
  jw() { const q = ($('#jwq').value || '').trim(); window.open('https://www.justwatch.com/ca/search?q=' + encodeURIComponent(q), '_blank', 'noopener'); },
  addShow() {
    const t = $('#af-t').value.trim(); if (!t) { toast('Add a title first'); return; }
    const plat = $('#af-p').value, th = $('#af-th').value, lang = $('#af-lang').value;
    let url = $('#af-l').value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!url) url = PLATFORMS[plat].search ? PLATFORMS[plat].search.replace('{q}', encodeURIComponent(t)) : PLATFORMS[plat].home;
    let a0 = Number($('#af-a0').value), a1 = Number($('#af-a1').value); if (a1 < a0) [a0, a1] = [a1, a0];
    const themes = [th]; if (lang === 'fr' && th !== 'french') themes.push('french');
    S.custom.push({ id: 'c-' + Date.now().toString(36), t, e: ($('#af-e').value || '📺').trim() || '📺', lang, th: themes, a: [a0, a1],
      p: Number($('#af-pace').value), m: clamp(Number($('#af-m').value) || 15, 3, 120), l: { [plat]: url }, why: 'Added by you.', custom: true });
    saveSettings(); toast(`${t} added`); keepScroll();
  },
  async share() {
    const url = location.origin + location.pathname + '#setup=' + encodeSetup(S);
    try { if (navigator.share) { await navigator.share({ title: 'Twrlzy setup', url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Setup link copied'); } catch (e) { window.prompt('Copy this link:', url); }
  },
  importPaste() {
    const m = ($('#imp').value || '').match(/setup=([A-Za-z0-9_-]+)/);
    if (!m) return toast("That doesn't look like a setup link");
    try { pendingImport = decodeSetup(m[1]); } catch (e) { return toast("That link didn't work. Copy it again."); }
    showImportDialog();
  },
  importYes() {
    S = mergeSettings(pendingImport); saveSettings(); pendingImport = null; closeOverlay(); clearSetupHash(); toast('Settings copied. Now pick who uses this iPad.');
    ACTIONS.parent();   // PIN first, then settings, so a curious kid can't wander in
  },
  importNo() { pendingImport = null; closeOverlay(); clearSetupHash(); render(); },
};
function keepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function setPath(obj, path, v) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }

document.addEventListener('pointerdown', unlock, { passive: true });
/* parent lock: hold for 1.2 s so little fingers don't wander into the settings */
let lockTimer = null, lockJustOpened = 0;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('[data-lock]'); if (!b) return;
  b.classList.add('holding'); clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { lockTimer = null; lockJustOpened = Date.now(); b.classList.remove('holding'); ACTIONS.parent(); }, 1200);
});
const cancelLock = () => { if (!lockTimer) return; clearTimeout(lockTimer); lockTimer = null; document.querySelectorAll('.lock.holding').forEach(b => b.classList.remove('holding')); };
document.addEventListener('pointerup', cancelLock, true);
document.addEventListener('pointercancel', cancelLock, true);
function restoreKid() {   /* who's on this iPad right now: a locked kid, or today's pick */
  const dev = store.get(K_DEV, null);
  if (dev && S.kids.some(k => k.id === dev)) { ui.kidId = dev; return true; }
  const t = store.get(K_TODAY, null);
  if (t && t.date === dayKey(new Date()) && S.kids.some(k => k.id === t.id)) { ui.kidId = t.id; return true; }
  ui.kidId = null; return false;
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-lock]')) { if (Date.now() - lockJustOpened > 600) toast(L().holdToOpen); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  unlock();
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.device) { if (el.value) store.set(K_DEV, el.value); else store.del(K_DEV); toast('Saved'); return; }
  if (el.dataset.show) { if (el.checked) delete S.hidden[el.dataset.show]; else S.hidden[el.dataset.show] = true; saveSettings(); return; }
  if (!el.dataset.set) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.type === 'num') v = Number(v);
  if (el.dataset.set.endsWith('.name')) v = String(v).trim() || 'Kid';
  setPath(S, el.dataset.set, v); saveSettings();
  if (el.dataset.set === 'tmdbKey') { ART = {}; store.set(K_ART, ART); ui.artErr = false; allShows(S).forEach(artFor); }
  keepScroll();
});
document.addEventListener('input', e => { if (e.target.dataset.input === 'showQ') { ui.showQ = e.target.value; refreshShowList(); } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden || ui.spinning || !['home', 'who', 'pick', 'dealer'].includes(ui.screen)) return;
  if (ui.screen !== 'who' && !restoreKid()) return go('who');
  render();
});
setInterval(() => {
  if (ui.spinning || $('#layer').children.length) return;
  if (ui.screen === 'home') { const k = curKid(); if (k && spinStatus(k, loadState(k.id)).kind !== 'ready') render(); }
  if (['home', 'pick', 'dealer'].includes(ui.screen) && !restoreKid()) go('who');   // a new day asks again
}, 20000);

function clearSetupHash() { try { if (/setup=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
function showImportDialog() {
  overlay(`<div class="dialog"><h2>Copy these settings?</h2><p>This replaces the Twrlzy settings on this iPad with the ones from the link.</p>
    <div class="dose-actions"><button class="btn" data-act="importNo">Cancel</button><button class="btn go" data-act="importYes">Copy them</button></div></div>`, 'dialogwrap');
}
/* ---------- start ---------- */
(function boot() {
  const m = location.hash.match(/setup=([A-Za-z0-9_-]+)/);
  if (m) { try { pendingImport = decodeSetup(m[1]); } catch (e) { pendingImport = null; clearSetupHash(); } }   // the link stays in the address bar until answered, so it can be copied
  if (restoreKid()) ui.screen = 'home';
  render();
  if (pendingImport) showImportDialog();
})();
</script>
</body>
</html>
